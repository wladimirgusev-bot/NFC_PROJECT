      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        shell: bash
        run: |
          gradle -p WladimirNfcCard --no-daemon assembleDebug
          cp WladimirNfcCard/app/build/outputs/apk/debug/app-debug.apk WladimirNfcCard.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WladimirNfcCard-APK
          path: WladimirNfcCard.apk
          if-no-files-found: error

      - name: Publish APK in Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" WladimirNfcCard.apk             --repo "$GH_REPO"             --target "${{ github.sha }}"             --title "Wladimir NFC Card $TAG"             --notes "Debug APK assembled automatically by GitHub Actions."
